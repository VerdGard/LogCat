plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// CI 通过环境变量提供签名信息;未提供时退回 debug 签名,保证产物可直接安装。
def ciKeyStore = System.getenv("SIGNING_STORE_FILE")

android {
    namespace 'com.solosu.logcat'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.logcat'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // 纯 JVM 单测:LogcatParser / LogcatCommand 不依赖 Android API,
    // 用 testOptions.unitTests.returnDefaultValues 兜住零星的 android.util.Log 调用。
    testOptions {
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        if (ciKeyStore) {
            ci {
                storeFile file(ciKeyStore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: ""
                keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig(ciKeyStore ? signingConfigs.ci : signingConfigs.debug)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    testImplementation libs.junit
}
