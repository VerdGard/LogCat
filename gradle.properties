#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Thu Oct 29 15:10:19 GMT 2026
android.nonTransitiveRClass=true
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# AGP 9.x 默认启用新 DSL 与内置 Kotlin 支持,而本项目仍使用 kotlin-android 插件
# 与旧 android{} DSL。按 AGP 官方过渡指引关闭这两个开关,保持现有构建脚本不变,
# 待后续单独迁移到内置 Kotlin(该 opt-out 将在 AGP 10 移除)。
android.newDsl=false
android.builtInKotlin=false
